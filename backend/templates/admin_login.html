<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoreBase Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f0f14; color: #e8e6f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
  }
  form {
    background: #1a1a22; padding: 2.5rem; border-radius: 12px;
    width: 320px; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 1.25rem; margin: 0 0 1.5rem; }
  input[type=password] {
    width: 100%; padding: .75rem; border-radius: 8px; border: 1px solid #33333f;
    background: #0f0f14; color: #e8e6f0; box-sizing: border-box; font-size: 1rem;
  }
  button {
    width: 100%; margin-top: 1rem; padding: .75rem; border: none; border-radius: 8px;
    background: #7a4a6b; color: #fff; font-weight: 600; cursor: pointer; font-size: 1rem;
  }
  button:hover { background: #8f5a7d; }
  .error { color: #ff6b6b; margin-top: .75rem; font-size: .875rem; }
</style>
</head>
<body>
  <form method="post" action="{{ url_for('admin_login_submit') }}">
    <h1>CoreBase Admin</h1>
    <input type="password" name="password" placeholder="Password" autofocus required>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
